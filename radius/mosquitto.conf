# Lab-only Mosquitto configuration. The IoT VLAN ACL restricts clients to
# tcp/1883 toward 192.168.50.20 only. Do not reuse this outside the lab.
# Password is an obvious placeholder; see radius/.env.example.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/mosquitto_passwd
persistence false
log_dest stdout
connection_messages true
