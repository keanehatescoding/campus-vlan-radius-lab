# FreeRADIUS clients for the campus lab.
# The shared secret must match:
#   radius/secrets.env                         (RADIUS_SECRET)
#   configs/SW1.cfg, SW2.cfg, SW3.cfg          (radius server ... key 0 ...)
# Change all of them together; tests/verify_configs.py enforces this.

client sw1 {
    ipaddr       = 192.168.99.11
    shortname    = sw1
    secret       = S3cr3t-Shared-Key-2026
    nastype      = other
}

client sw2 {
    ipaddr       = 192.168.99.12
    shortname    = sw2
    secret       = S3cr3t-Shared-Key-2026
    nastype      = other
}

client sw3 {
    ipaddr       = 192.168.99.13
    shortname    = sw3
    secret       = S3cr3t-Shared-Key-2026
    nastype      = other
}

# Local testing only (radtest / eapol_test run on the Docker host).
client localhost {
    ipaddr       = 127.0.0.1
    shortname    = localhost
    secret       = S3cr3t-Shared-Key-2026
    nastype      = other
}
