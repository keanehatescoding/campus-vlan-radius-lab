# guest1 -> RADIUS Tunnel-Private-Group-Id 30
# EAP-MD5 is used because the stock FreeRADIUS eap module supports it without
# installing a client/server certificate. See endpoints/client/README.md.
ap_scan=0
ctrl_interface=/var/run/wpa_supplicant

network={
    key_mgmt=IEEE8021X
    eap=MD5
    identity="guest1"
    password="Guest1Pass!"
    priority=1
}
