# Deliberate bad password for the guest-fallback test (T09).
# Identity staff1 with the wrong password should be rejected, after which SW2
# applies: authentication event fail action authorize vlan 30
ap_scan=0
ctrl_interface=/var/run/wpa_supplicant

network={
    key_mgmt=IEEE8021X
    eap=MD5
    identity="staff1"
    password="Definitely-Wrong-Password!"
    priority=1
}
