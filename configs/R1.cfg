!
! R1 - Campus gateway, DHCP server, NAT/PAT and firewall
! Role: default gateway for VLANs 10/20/30/40/99 and the 192.168.50.0/24 server segment
! Paste with: enable / configure terminal / <paste> / end / write memory
!
hostname R1
!
enable secret En4ble-Secret-2026
!
no ip domain lookup
ip domain name campus.local
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
banner motd #
Campus Network - Authorized access only
#
!
ip cef
ip subnet-zero
!
logging buffered 16384 debugging
logging console warnings
!
! ============================================================
! Named extended ACLs - applied INBOUND on the client VLAN SVIs
! ============================================================
!
ip access-list extended STAFF_IN
 remark Staff: full access to Internet, servers, other VLANs and MGMT
 permit ip any any
 deny ip any any log
!
ip access-list extended STUDENT_IN
 remark Student: DHCP, gateway diagnostics, Internet DNS/HTTP/HTTPS only
 remark All RFC1918 destinations (STAFF/STUDENT/GUEST/IOT/MGMT/SERVER) are denied
 permit udp any eq bootpc any eq bootps
 permit icmp any host 192.168.20.1 echo
 permit icmp any any echo-reply
 deny ip any 192.168.0.0 0.0.255.255
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 permit tcp any any established
 permit udp any any eq domain
 permit tcp any any eq domain
 permit tcp any any eq www
 permit tcp any any eq 443
 deny ip any any log
!
ip access-list extended GUEST_IN
 remark Guest: DHCP, gateway diagnostics, Internet DNS/HTTP/HTTPS only
 remark All RFC1918 destinations are denied
 permit udp any eq bootpc any eq bootps
 permit icmp any host 192.168.30.1 echo
 permit icmp any any echo-reply
 deny ip any 192.168.0.0 0.0.255.255
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 permit tcp any any established
 permit udp any any eq domain
 permit tcp any any eq domain
 permit tcp any any eq www
 permit tcp any any eq 443
 deny ip any any log
!
ip access-list extended IOT_IN
 remark IoT: DHCP, DNS to the simulated Internet resolver, MQTT to broker only
 remark The MQTT permit must precede the RFC1918 deny because the broker is 192.168.50.20
 permit udp any eq bootpc any eq bootps
 permit udp any host 8.8.8.8 eq domain
 permit tcp any host 8.8.8.8 eq domain
 permit tcp any host 192.168.50.20 eq 1883
 permit icmp any any echo-reply
 deny ip any 192.168.0.0 0.0.255.255 log
 deny ip any 10.0.0.0 0.255.255.255 log
 deny ip any 172.16.0.0 0.15.255.255 log
 deny ip any any log
!
ip access-list extended MGMT_IN
 remark MGMT: RADIUS to 192.168.50.10 only, plus return traffic for operator sessions
 permit udp 192.168.99.0 0.0.0.255 host 192.168.50.10 eq 1812
 permit udp 192.168.99.0 0.0.0.255 host 192.168.50.10 eq 1813
 permit udp host 192.168.50.10 eq 1812 192.168.99.0 0.0.0.255
 permit udp host 192.168.50.10 eq 1813 192.168.99.0 0.0.0.255
 permit icmp 192.168.99.0 0.0.0.255 any echo-reply
 permit tcp any any established
 deny ip any any log
!
! ============================================================
! NAT/PAT - inside VLANs 10/20/30/40 only.
! Server segment (192.168.50.0/24) and MGMT (VLAN 99) are not translated.
! ============================================================
!
ip access-list standard NAT_INSIDE
 permit 192.168.10.0 0.0.0.255
 permit 192.168.20.0 0.0.0.255
 permit 192.168.30.0 0.0.0.255
 permit 192.168.40.0 0.0.0.255
!
ip nat inside source list NAT_INSIDE interface GigabitEthernet0/2 overload
!
! ============================================================
! DHCP - one pool per client VLAN, all exclude .1-.20
! ============================================================
!
service dhcp
!
ip dhcp excluded-address 192.168.10.1 192.168.10.20
ip dhcp excluded-address 192.168.20.1 192.168.20.20
ip dhcp excluded-address 192.168.30.1 192.168.30.20
ip dhcp excluded-address 192.168.40.1 192.168.40.20
!
ip dhcp pool STAFF
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 8.8.8.8
 domain-name staff.campus.local
 lease 0 8
!
ip dhcp pool STUDENT
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 8.8.8.8
 domain-name student.campus.local
 lease 0 4
!
ip dhcp pool GUEST
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 8.8.8.8
 domain-name guest.campus.local
 lease 0 2
!
ip dhcp pool IOT
 network 192.168.40.0 255.255.255.0
 default-router 192.168.40.1
 dns-server 8.8.8.8
 domain-name iot.campus.local
 lease 0 1
!
! ============================================================
! Interfaces
! ============================================================
!
interface GigabitEthernet0/0
 description TRUNK-TO-SW1-G0/0
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description STAFF-VLAN-10
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip nat inside
 ip access-group STAFF_IN in
!
interface GigabitEthernet0/0.20
 description STUDENT-VLAN-20
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip nat inside
 ip access-group STUDENT_IN in
!
interface GigabitEthernet0/0.30
 description GUEST-VLAN-30
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip nat inside
 ip access-group GUEST_IN in
!
interface GigabitEthernet0/0.40
 description IOT-VLAN-40
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
 ip nat inside
 ip access-group IOT_IN in
!
interface GigabitEthernet0/0.99
 description MGMT-VLAN-99
 encapsulation dot1Q 99
 ip address 192.168.99.1 255.255.255.0
 ip access-group MGMT_IN in
!
interface GigabitEthernet0/1
 description SERVER-SEGMENT-RADIUS-AND-MQTT
 ip address 192.168.50.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 description UPLINK-TO-R2
 ip address 10.0.0.1 255.255.255.252
 ip nat outside
 no shutdown
!
! ============================================================
! Routing and management access
! ============================================================
!
ip route 0.0.0.0 0.0.0.0 10.0.0.2
!
username admin privilege 15 secret En4ble-Secret-2026
!
line con 0
 logging synchronous
 login local
line vty 0 4
 logging synchronous
 login local
!
end
