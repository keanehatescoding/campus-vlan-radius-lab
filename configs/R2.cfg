!
! R2 - Simulated ISP / Internet edge
! Loopback 8.8.8.8 represents a public Internet host.
! R1 performs PAT; R2 only needs a return route for the campus summary.
!
hostname R2
!
enable secret En4ble-Secret-2026
!
no ip domain lookup
ip domain name isp.local
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
banner motd #
Simulated ISP router - lab use only
#
!
ip cef
!
logging buffered 16384 debugging
logging console warnings
!
interface Loopback0
 description SIMULATED-INTERNET-HOST
 ip address 8.8.8.8 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK-TO-R1-G0/2
 ip address 10.0.0.2 255.255.255.252
 no shutdown
!
! Return route for all campus subnets. R1 NATs 10/20/30/40 to 10.0.0.1.
ip route 192.168.0.0 255.255.0.0 10.0.0.1
!
! Optional HTTP service on 8.8.8.8:80 so "curl http://8.8.8.8" has a listener.
! A 401/200 response is enough to prove TCP/80 reaches the simulated Internet.
ip http server
ip http authentication local
!
username admin privilege 15 secret En4ble-Secret-2026
!
line con 0
 logging synchronous
 login local
line vty 0 4
 logging synchronous
 login local
!
end
